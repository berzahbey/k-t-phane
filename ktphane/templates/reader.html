<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#faf7f0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>{{ info.title }} · Kitaplık</title>
<link rel="stylesheet" href="/static/fonts/fonts.css?v={{ version }}">
<link rel="stylesheet" href="/static/reader.css?v={{ version }}">
<script>window.BOOK = {{ info | tojson }};</script>
</head>
<body class="{{ 'rtl-book' if info.rtl else '' }}">
<header class="bar topbar">
  <a class="ib" href="/" title="Kitaplığa dön"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></a>
  <button class="ib" id="btnToc" title="İçindekiler"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg></button>
  <div class="tb-title"><div class="t" dir="auto">{{ info.title }}</div><div class="s" dir="auto" id="subTitle">{{ info.author }}</div></div>
  <button class="ib" id="btnSearch" title="Kitapta ara"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></button>
  <button class="ib" id="btnNotes" title="Notlar ve vurgular"><svg viewBox="0 0 24 24"><path d="M5 4h14v16l-4-3H5z"/><path d="M9 9h6M9 12h4"/></svg></button>
  <button class="ib" id="btnBookmark" title="Yer imi"><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-6-5-6 5z"/></svg></button>
  <button class="ib" id="btnSettings" title="Görünüm: tema, yazı boyutu"><span class="aa">Aa</span></button>
  <button class="ib" id="btnFull" title="Tam ekran"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
</header>

<main id="stage">
  {% if info.ext == 'pdf' %}<div id="viewer"><div id="pdfwrap"></div></div>{% else %}<div id="viewer"></div>{% endif %}
</main>
<div class="mini top" id="miniTop" dir="auto"></div><div class="mini bot" id="miniBot"></div>
<div id="msg"><div><div class="spinner"></div>Kitap açılıyor…</div></div>

<footer class="bar bottombar">
  <div class="prog-row">
    <span class="chap" id="chap" dir="auto"></span>
    {% if info.ext == 'pdf' %}<span><input class="page-input" id="pageInput" inputmode="numeric" aria-label="Sayfa"> / <span id="pageTotal">–</span></span>{% endif %}
    <span class="pct" id="pct"></span>
  </div>
  <div class="prog-row"><input type="range" id="slider" min="0" max="1000" value="0" aria-label="Kitapta konum"></div>
</footer>

<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer">
  <div class="drawer-head"><h3 dir="auto">{{ info.title }}</h3><button class="ib" id="btnCloseDrawer" title="Kapat"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="tabs">
    <button data-tab="toc">İçindekiler</button>
    <button data-tab="notes">Notlar <span id="notesCount"></span></button>
    <button data-tab="search">Ara</button>
  </div>
  <div class="drawer-body">
    <div class="pane toc" data-pane="toc" id="tocBox"></div>
    <div class="pane" data-pane="notes" hidden>
      <div class="export-row">
        <div class="seg"><button data-nkind="all" class="on">Tümü</button><button data-nkind="notes">Notlar</button><button data-nkind="bookmark">Yer imleri</button></div>
        <button class="btn" id="btnExport" title="Notları Markdown dosyası olarak indir">Dışa aktar</button>
      </div>
      <button class="btn addnote" id="btnAddNote">+ Buraya not ekle</button>
      <div id="notesList" data-kind="all"></div>
    </div>
    <div class="pane" data-pane="search" hidden>
      <form class="search-box" id="searchForm"><input id="searchInput" type="search" placeholder="Kelime veya ifade…" dir="auto" autocomplete="off"><button class="btn primary">Ara</button></form>
      <div id="searchResults"></div>
    </div>
  </div>
</aside>

<div class="sheet" id="settings" hidden><div id="settingsBody"></div></div>

<div class="selbar" id="selbar" hidden>
  <button class="dot c-yellow" data-color="yellow" title="Sarı vurgu"></button>
  <button class="dot c-green" data-color="green" title="Yeşil vurgu"></button>
  <button class="dot c-blue" data-color="blue" title="Mavi vurgu"></button>
  <button class="dot c-pink" data-color="pink" title="Pembe vurgu"></button>
  <button class="dot c-orange" data-color="orange" title="Turuncu vurgu"></button>
  <span class="sep"></span>
  <button class="txtbtn" data-act="note">Not</button>
  <button class="txtbtn" data-act="copy">Kopyala</button>
  <button class="txtbtn" data-act="remove" hidden>Kaldır</button>
</div>

<dialog class="note" id="noteDlg">
  <h3 id="ndTitle" style="margin:0 0 10px;font-size:16px">Not ekle</h3>
  <blockquote id="ndQuote" dir="auto"></blockquote>
  <textarea id="ndText" dir="auto" placeholder="Notunuz…"></textarea>
  <div class="acts"><button class="btn" id="ndCancel" type="button">Vazgeç</button><button class="btn primary" id="ndSave" type="button">Kaydet</button></div>
</dialog>

<script src="/static/reader-core.js?v={{ version }}"></script>
{% if info.ext == 'pdf' %}
<script src="/static/vendor/pdfjs/pdf.min.js"></script>
<script src="/static/reader-pdf.js?v={{ version }}"></script>
{% else %}
<script src="/static/vendor/jszip.min.js"></script>
<script src="/static/vendor/epub.min.js"></script>
<script src="/static/reader-epub.js?v={{ version }}"></script>
{% endif %}
</body>
</html>
