# ZimaOS / CasaOS: App Store > "+" > "Install a customized app" > "Import" ile bu dosyayı yükleyin.
# Kitap klasörünüz farklıysa yalnızca "/media/ZimaOS-HD/Kitap" kısmını değiştirin.
name: k-tphane
services:
  k-tphane:
    image: ghcr.io/berzahbey/k-t-phane:latest
    container_name: k-tphane
    restart: unless-stopped
    ports:
      - "5090:5000"
    environment:
      TZ: Europe/Amsterdam
      SCAN_INTERVAL: "1800"     # saniye; yeni kitaplar için otomatik tarama aralığı (0 = kapalı)
      APP_PASSWORD: ""          # doluysa tarayıcı şifre sorar (dışarı açacaksanız mutlaka doldurun)
      APP_USER: ""
      # Yapay zeka (isteğe bağlı, ÜCRETSİZ katman): https://aistudio.google.com/apikey adresinden
      # faturalandırması KAPALI bir projeyle anahtar alın. Boş bırakılırsa kurallar + içerik analizi kullanılır.
      GEMINI_API_KEY: ""
      GEMINI_MODEL: "gemini-flash-lite-latest"
      GEMINI_DAILY_LIMIT: "500"   # günde en fazla bu kadar istek (ücretsiz kotanın altında kalır)
      GEMINI_RPM: "8"             # dakikada en fazla istek
      OCR_LANGS: "tur+ara+fas+eng"
    volumes:
      - /media/ZimaOS-HD/Kitap:/books               # "Düzenle" özelliği kitapları taşıyabilsin diye yazılabilir
      - /DATA/AppData/k-tphane/data:/data           # önbellek ve kapak resimleri (otomatik oluşur)
    x-casaos:
      envs:
        - container: SCAN_INTERVAL
          description:
            en_us: Automatic rescan interval in seconds (0 = off)
        - container: GEMINI_API_KEY
          description:
            en_us: Optional free Gemini API key (AI Studio, billing disabled)
        - container: APP_PASSWORD
          description:
            en_us: Optional password (HTTP basic auth)
      ports:
        - container: "5000"
          description:
            en_us: Web UI
      volumes:
        - container: /books
          description:
            en_us: Book folder (read-only)
        - container: /data
          description:
            en_us: Cache and covers

x-casaos:
  architectures:
    - amd64
  main: k-tphane
  author: berzahbey
  developer: berzahbey
  category: Utilities
  icon: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/calibre-web.png
  index: /
  port_map: "5090"
  scheme: http
  title:
    en_us: Kitaplık
    custom: Kitaplık
  tagline:
    en_us: Personal book library
  description:
    en_us: Browse, search and read your PDF/EPUB library.
